<style>
/* Layout: スマホ幅の1カラムアプリ。上にモック操作バー、中央に端末幅の画面、下に固定の送信ボタン */
:root{
  --paper:#faf9f6; --card:#ffffff; --ink:#1c2430; --muted:#5d6774; --line:#e3e0d8;
  --navy:#0f2742; --navy-ink:#ffffff; --dept:#1f4e79; --dept-soft:#e6eef6;
  --vermilion:#b1442f; --vermilion-soft:#f7e7e3;
  --ok:#2f6b4f; --ok-soft:#e3f0e8; --wait:#7a5a14; --wait-soft:#f6eed9; --done:#6b7280; --done-soft:#eceae5;
  --field:#fdfcfa; --focus:#2b6cb0; --mock:#efe9dc;
  --f-head:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13171d; --card:#1b2129; --ink:#e7e9ec; --muted:#a3abb6; --line:#2d3540;
  --navy:#0b1d33; --dept:#8fb6dd; --dept-soft:#1e3044;
  --vermilion:#e2876f; --vermilion-soft:#3a2420;
  --ok:#8fcbac; --ok-soft:#1d3329; --wait:#e2c27a; --wait-soft:#352c17; --done:#a3abb6; --done-soft:#262c34;
  --field:#161b22; --focus:#7fb0e8; --mock:#211f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13171d; --card:#1b2129; --ink:#e7e9ec; --muted:#a3abb6; --line:#2d3540;
  --navy:#0b1d33; --dept:#8fb6dd; --dept-soft:#1e3044;
  --vermilion:#e2876f; --vermilion-soft:#3a2420;
  --ok:#8fcbac; --ok-soft:#1d3329; --wait:#e2c27a; --wait-soft:#352c17; --done:#a3abb6; --done-soft:#262c34;
  --field:#161b22; --focus:#7fb0e8; --mock:#211f1a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
h1,h2,h3{font-family:var(--f-head);font-weight:700;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* モック操作バー */
.mockbar{background:var(--mock);border-bottom:1px solid var(--line);padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mockbar-in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--muted)}
.mockbar label{display:flex;gap:6px;align-items:center}
.mockbar select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.mocknote{flex-basis:100%;font-size:12px}

/* アプリ本体 */
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--paper)}
.top{background:var(--navy);color:var(--navy-ink);padding-block:14px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand h1{font-size:19px;letter-spacing:.08em}
.brand small{font-size:11px;letter-spacing:.12em;opacity:.7}
.who{font-size:12px;opacity:.85;margin-top:2px}
.tabs{display:flex;margin-top:10px;overflow-x:auto}
.tabs button{flex:1 0 auto;background:none;border:0;color:var(--navy-ink);opacity:.65;padding:10px 12px;font-size:14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:#e9d9a8;font-weight:700}

main{padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.date{font-family:var(--f-head);font-size:20px}
.date .sub{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:6px}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.sec-title h2{font-size:17px}
.sec-title span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}

.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.tag.dept{background:var(--dept-soft);color:var(--dept);font-weight:700}
.tag.urgent{background:var(--vermilion-soft);color:var(--vermilion);font-weight:700}
.tag.kind{border:1px solid var(--line);color:var(--muted)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:700}
.req{color:var(--vermilion);font-size:11px;margin-left:4px;font-weight:700}
.opt{color:var(--muted);font-size:11px;margin-left:4px;font-weight:400}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=url],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:10px 12px;font-size:16px}
textarea{min-height:84px;resize:vertical;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}

.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--dept);border-radius:6px;overflow:hidden}
.seg button{background:var(--card);border:0;border-left:1px solid var(--dept);padding:8px 4px;font-size:14px;cursor:pointer;color:var(--dept)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--dept);color:var(--card);font-weight:700}

.consult-head{display:flex;justify-content:space-between;align-items:center}
.consult-head h3{font-size:15px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.addbtn{border:1.5px dashed var(--dept);background:transparent;color:var(--dept);border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
.progress-item{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.progress-item:first-of-type{border-top:0;padding-top:0}

.sharenote{font-size:12px;background:var(--done-soft);color:var(--muted);padding:6px 10px;border-radius:4px}

.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottom-in{max-width:448px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:8px;padding:13px;font-weight:700;font-size:15px;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{flex:0 0 auto;padding:8px 14px;font-size:13px}
.btn.vermilion{background:var(--vermilion);color:#fff}

/* 確認画面・Todoistプレビュー */
.preview{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.preview-h{background:var(--dept-soft);color:var(--dept);font-size:12px;font-weight:700;padding:6px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.preview-b{padding:12px;display:flex;flex-direction:column;gap:8px}
.ptitle{font-weight:700;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
pre.desc{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:13px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px;line-height:1.65}
.daily-view dt{font-size:13px;font-weight:700;color:var(--dept)}
.daily-view dd{margin:0 0 10px;white-space:pre-wrap}

/* 自分の相談 */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .n{font-variant-numeric:tabular-nums;margin-left:4px;opacity:.75}
.status{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.status.wait{background:var(--wait-soft);color:var(--wait)}
.status.ans{background:var(--ok-soft);color:var(--ok)}
.status.done{background:var(--done-soft);color:var(--done)}
.status.fail{background:var(--vermilion-soft);color:var(--vermilion)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.c-title{font-weight:700;line-height:1.5}
.c-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thread{display:flex;flex-direction:column;gap:8px}
.cmt{border-radius:6px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.cmt.boss{background:var(--ok-soft)}
.cmt.follow{background:var(--field);border:1px solid var(--line)}
.cmt .who{font-size:11px;color:var(--muted);opacity:1;margin:0 0 4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
details.c summary{cursor:pointer;list-style:none}
details.c summary::-webkit-details-marker{display:none}
.more{font-size:12px;color:var(--dept);margin-top:4px}

/* 確認ダイアログ（ページ内） */
.inline-confirm{border:1px solid var(--vermilion);background:var(--vermilion-soft);border-radius:6px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:8px}

/* 社長用 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.done-msg{text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.done-msg .mark{font-family:var(--f-head);font-size:28px;color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.card,.preview{transition:border-color .15s}}
</style>

}
function tabsFor(){return [["write","報告を書く"],["mine","自分の相談"],["detail","過去の報告"]];}
function renderShell(){
  const p=me();
  $("#whoLine").innerHTML=`${esc(p.name)}さん　<span class="tag dept" style="background:rgba(255,255,255,.14);color:#fff">${esc(p.dept)}</span>`+(p.admin?`　<span style="font-size:11px">テストは「BEACONテスト」プロジェクトに起票</span>`:"");
  $("#tabs").innerHTML=tabsFor().map(([k,l])=>`<button role="tab" aria-selected="${state.tab===k}" data-tab="${k}">${l}</button>`).join("");
}
function render(){renderShell();({write:renderWrite,mine:renderMine,detail:renderDetail})[state.tab]();}

/* ---------- 報告を書く ---------- */
function renderWrite(){
  if(state.step==="confirm")return renderConfirm();
  if(state.step==="sent")return renderSent();
  const f=form(),s=SAMPLE(state.who);
  let h=`<div class="date">${jdate(TODAY)}<span class="sub">${esc(f.label)}</span></div>`;
  if(s.note)h+=`<div class="sharenote">${esc(s.note)}</div>`;
  h+=`<div class="sec-title"><h2>日報</h2><span>空欄の項目は送られません</span></div>
  <section class="card">`+f.fields.map(x=>`<div class="field"><label for="d_${x.id}">【${esc(x.t)}】</label>${x.hint?`<span class="hint">${esc(x.hint)}</span>`:""}<textarea id="d_${x.id}" placeholder="${esc((s.ph||{})[x.id]||x.ph||"")}"></textarea></div>`).join("");
  if(f.progress){
    const pg=f.progress,ex=s.progress||pg;
    h+=`<div class="field"><span class="lbl">【${esc(pg.t)}】<span class="opt">案件ごとに1件</span></span>`;
    for(let i=0;i<state.progress;i++)h+=`<div class="progress-item"><input type="text" id="pg_n${i}" placeholder="${esc(pg.name)}（例：${esc(ex.nph)}）"><textarea id="pg_b${i}" placeholder="${esc(ex.bph)}" style="min-height:64px"></textarea></div>`;
    h+=`<button class="linkbtn" data-act="addprog" style="align-self:flex-start">＋案件を追加</button></div>`;
  }
  h+=`</section>
  <div class="sec-title"><h2>社長への確認・相談</h2><span>1件ずつ入力</span></div>`;
  state.consults.forEach((c,i)=>{h+=consultCard(c,i)});
  h+=`<button class="addbtn" data-act="addc">＋相談を追加</button>
  <p class="hint">続きの話は、新しい相談にせず「自分の相談」から続報を出してください。</p>`;
  $("#main").innerHTML=h;
  Object.keys(daily).forEach(k=>{const el=document.getElementById(k);if(el)el.value=daily[k];});
  setBottom(`<button class="btn primary" data-act="toconfirm">内容を確認する</button>`);
}
function consultCard(c,i){
  const share=c.kind==="共有のみ";
  return `<section class="card" data-ci="${i}">
    <div class="consult-head"><h3>相談 ${i+1}</h3><button class="linkbtn" data-act="delc" data-i="${i}">この相談を消す</button></div>
    <div class="field"><span class="lbl">種類</span>
      <div class="seg" role="group" aria-label="相談の種類">${KINDS.map(([k])=>`<button aria-pressed="${c.kind===k}" data-act="kind" data-i="${i}" data-k="${k}">${k}</button>`).join("")}</div>
      <span class="hint">${esc(KINDS.find(k=>k[0]===c.kind)[1])}</span></div>
    ${share?`<div class="sharenote">共有のみは記録だけ残ります。社長の回答待ちにはなりません。</div>`:""}
    <div class="field"><label for="c_what${i}">${share?"何を知らせるか":"何を決めてほしいか"}<span class="req">必須</span></label>
      <input type="text" id="c_what${i}" data-k="what" data-i="${i}" value="${esc(c.what)}" placeholder="1行で書いてください">
      <span class="hint">${share?"記録の見出しになります":"1行で。Todoistのタイトルになります"}</span></div>
    <div class="field"><label for="c_to${i}">相手先・件名<span class="opt">推奨</span></label>
      <input type="text" id="c_to${i}" data-k="to" data-i="${i}" value="${esc(c.to)}" placeholder="例：○○様／船橋市 確定測量"></div>
    <div class="field"><label for="c_bg${i}">背景・事実<span class="opt">推奨：金額・日付・相手の名前</span></label>
      <textarea id="c_bg${i}" data-k="bg" data-i="${i}" placeholder="経緯、金額、日付、相手の名前など">${esc(c.bg)}</textarea></div>
    <div class="row2">
      <div class="field"><label for="c_due${i}">期限<span class="opt">任意</span></label>
        <input type="date" id="c_due${i}" data-k="due" data-i="${i}" value="${esc(c.due)}">
        ${share||c.due?"":`<span class="hint">空欄なら ${sdate(nextBiz(TODAY))}（翌営業日）を仮期限にします</span>`}</div>
      <div class="field"><label for="c_link${i}">資料のリンク<span class="opt">任意</span></label>
        <input type="url" id="c_link${i}" data-k="link" data-i="${i}" value="${esc(c.link)}" placeholder="Googleドライブのリンク"></div>
    </div>
  </section>`;
}

function taskTitle(c,p){return `${c.to?`[${c.to}] `:""}${c.what||"（未入力）"}（${p.name}さん）`;}
function taskDesc(c,p,id){
  const due=c.due?c.due.replace(/-/g,"/"):`${sdate(nextBiz(TODAY))}（報告に期限の記載なし → 仮期限）`;
  return `【何を判断するか／担当：藤本さん】\n${c.what}\n【種類】${c.kind}\n【背景】\n${c.bg||"（記載なし）"}\n【誰に返すか】${p.name}さん\n【期限】${due}\n【資料】${c.link||"なし"}\n【出典】BEACON ${sdate(TODAY)} ${p.name}（報告ID ${id}）\n※この日の日報はタスクの最初のコメントに付けています`;
}
const ASK_WORDS=["よろしいでしょうか","よろしいですか","いかがでしょうか","ご確認ください","ご確認お願い","ご確認をお願い","ご判断","押印","してもよい","してよい","どうしますか","どうしましょう","ご指示"];
function findAsks(){
  const out=[];
  Object.entries(daily).forEach(([k,v])=>{(v||"").split(/\n|。/).forEach(line=>{const t=line.replace(/^[・\s]+/,"").trim();if(t&&!state.skipped.includes(t)&&ASK_WORDS.some(w=>t.includes(w))&&!state.consults.some(c=>c.what&&t.includes(c.what.slice(0,8))))out.push(t);});});
  return out;
}
function renderConfirm(){
  const p=me();
  let h=`<div class="date">送る前の確認</div>
  <p class="hint">下の内容で記録し、相談はTodoistの「${esc(p.project)}」の📥社長がやる に起票します。</p>`;
  const bad=state.consults.filter(c=>!c.what.trim());
  if(bad.length)h+=`<div class="inline-confirm">1行目が空の相談が${bad.length}件あります。戻って入力してください。</div>`;
  findAsks().forEach((t,j)=>{h+=`<div class="inline-confirm" style="border-color:var(--wait);background:var(--wait-soft)"><div><b>日報の中に、社長への相談らしい文があります。相談にしますか？</b></div><div>「${esc(t)}」</div><div class="hint">相談にしないと、社長のTodoistには届きません。</div><div class="actions"><button class="btn ghost small" data-act="skipask" data-t="${esc(t)}">このまま送る</button><button class="btn primary small" data-act="toask" data-t="${esc(t)}">相談にする</button></div></div>`;});
  state.consults.forEach((c,i)=>{
    const id=`R20261015-004`;
    if(c.kind==="共有のみ"){h+=`<div class="preview"><div class="preview-h"><span>相談 ${i+1}：共有のみ</span><span>Todoistには起票しません</span></div><div class="preview-b"><div class="ptitle">${esc(c.what)}</div><div class="c-meta">${esc(c.to)}</div></div></div>`;return;}
    h+=`<div class="preview"><div class="preview-h"><span>相談 ${i+1}：Todoistに起票される形</span><span>${esc(p.project)} ／ 📥社長がやる</span></div>
      <div class="preview-b"><div class="ptitle">${esc(taskTitle(c,p))}</div>
      <div class="meta"><span>ラベル <b>📥社長がやる</b></span><span>優先度 <b>p1</b></span><span>担当 <b>藤本</b></span><span>期限 <b>${c.due?c.due.replace(/-/g,"/"):sdate(nextBiz(TODAY))}</b></span></div>
      <pre class="desc">${esc(taskDesc(c,p,id))}</pre></div></div>`;
  });
  $("#main").innerHTML=h;
  setBottom(`<button class="btn ghost" data-act="back">戻って直す</button><button class="btn primary" data-act="send" ${bad.length?"disabled style='opacity:.5'":""}>報告を送る</button>`);
}
function renderSent(){
  const n=state.consults.filter(c=>c.kind!=="共有のみ").length,sh=state.consults.length-n;
  $("#main").innerHTML=`<div class="card done-msg"><div class="mark">送信しました</div>
    <div>日報を記録し、相談${n}件をTodoistの📥社長がやる に起票しました。${sh?`共有${sh}件は記録だけ残しました。`:""}</div>
    <div class="hint">報告ID R20261015-004　／　回答は「自分の相談」で見られます</div></div>
    <div class="card"><div class="c-top"><span class="status fail">起票失敗の例</span></div>
    <div style="font-size:14px">Todoistにつながらず起票できなかった場合も、報告そのものは保存されています。BEACONが30分ごとに自動で起票し直し、それでも失敗したら藤本さんにメールで知らせます。</div></div>`;
  setBottom(`<button class="btn ghost" data-act="tomine">自分の相談を見る</button><button class="btn primary" data-act="again">新しい報告を書く</button>`);
}

/* ---------- 自分の相談 ---------- */
const ST={wait:["回答待ち","wait"],ans:["回答あり","ans"],done:["完了","done"]};
function renderMine(){
  const MINE=SAMPLE(state.who).mine;
  const cnt=k=>k==="all"?MINE.length:MINE.filter(m=>m.st===k).length;
  let h=`<div class="filters">${[["all","すべて"],["ans","回答あり"],["wait","回答待ち"],["done","完了"]].map(([k,l])=>`<button class="chip" aria-pressed="${state.filter===k}" data-act="filter" data-f="${k}">${l}<span class="n">${cnt(k)}</span></button>`).join("")}</div>
  <p class="hint">状態はTodoistから読み込んでいます（最終更新 10:05）。</p>`;
  MINE.filter(m=>state.filter==="all"||m.st===state.filter).forEach(m=>{
    h+=`<section class="card"><div class="c-top"><span class="status ${ST[m.st][1]}">${ST[m.st][0]}</span>
      <span class="c-meta">${m.date} 提出 ／ 期限 ${m.due}${m.overdue&&m.st!=="done"?` <span class="tag urgent">期限超過</span>`:""}</span></div>
      <div class="c-title">${esc(m.title)}</div>`;
    if(m.thread.length)h+=`<div class="thread">${m.thread.map(x=>`<div class="cmt ${x.c}"><div class="who">${esc(x.who)}</div>${esc(x.t)}</div>`).join("")}</div>`;
    if(m.st!=="done"){
      h+=state.openAns===m.id+"f"?`<div class="field"><label for="fu_${m.id}">続報</label>
        <textarea id="fu_${m.id}" placeholder="社長の回答を受けての対応、追加の事実など"></textarea>
        <span class="hint">「【続報：BEACON ${sdate(TODAY)} ${me().name}】」を先頭に付けてTodoistにコメントします。${m.st==="ans"?"このタスクは📥社長がやる に戻ります。":"すでに📥社長がやる にあるので、場所は変わりません。"}</span></div>
        <div class="actions"><button class="btn ghost small" data-act="close">やめる</button><button class="btn primary small" data-act="close">続報を出す</button></div>`
      :state.openAns===m.id+"c"?`<div class="inline-confirm">この相談を「完了」にします。Todoistのタスクもチェックされます。よろしいですか？
        <div class="actions"><button class="btn ghost small" data-act="close">やめる</button><button class="btn vermilion small" data-act="close">完了にする</button></div></div>`
      :`<div class="actions"><button class="btn ghost small" data-act="openc" data-id="${m.id}">完了にする</button><button class="btn primary small" data-act="openf" data-id="${m.id}">続報を出す</button></div>`;
    }
    h+=`</section>`;
  });
  $("#main").innerHTML=h;setBottom(null);
}

/* ---------- 報告の詳細（出典リンクの行き先） ---------- */
function renderDetail(){
  const s=SAMPLE(state.who),d=s.detail,p=me();
  $("#main").innerHTML=`<div class="date">${esc(d.date)}<span class="sub">${esc(p.name)}さん・${esc(form().label)}</span></div>
  <p class="hint">自分が出した過去の報告を見る画面です（報告ID ${esc(d.id)}）。</p>
  <section class="card daily-view"><dl style="margin:0">${d.daily.map(([t,b])=>`<dt>【${esc(t)}】</dt><dd>${esc(b)}</dd>`).join("")}</dl></section>
  <div class="sec-title"><h2>相談</h2><span>${d.consults.length}件</span></div>
  ${d.consults.map(i=>s.mine[i]).map(m=>`<section class="card"><div class="c-top"><span class="status ${ST[m.st][1]}">${ST[m.st][0]}</span><span class="tag kind">${m.kind}</span></div><div class="c-title">${esc(m.title)}</div><div class="c-meta">TodoistタスクID 88123450${m.id.slice(1)}　<a href="#" style="color:var(--dept)">Todoistで開く</a></div></section>`).join("")}`;
  setBottom(null);
}

function setBottom(html){const b=$("#bottom");if(!html){b.hidden=true;return;}b.hidden=false;$("#bottomIn").innerHTML=html;}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;state.openAns=null;render();window.scrollTo(0,0);return;}
  const a=t.dataset.act,i=+t.dataset.i;
  if(a==="addc")state.consults.push(newConsult());
  else if(a==="delc")state.consults.splice(i,1);
  else if(a==="kind")state.consults[i].kind=t.dataset.k;
  else if(a==="addprog")state.progress++;
  else if(a==="toconfirm"){state.step="confirm";window.scrollTo(0,0);}
  else if(a==="back")state.step="form";
  else if(a==="send"){if(t.disabled)return;state.step="sent";window.scrollTo(0,0);}
  else if(a==="again")resetForm();
  else if(a==="tomine"){state.tab="mine";resetForm();}
  else if(a==="filter")state.filter=t.dataset.f;
  else if(a==="openf")state.openAns=t.dataset.id+"f";
  else if(a==="openc")state.openAns=t.dataset.id+"c";
  else if(a==="close")state.openAns=null;
  else if(a==="toask"){state.consults.push(newConsult({kind:"判断",what:t.dataset.t}));state.step="form";window.scrollTo(0,document.body.scrollHeight);}
  else if(a==="skipask")state.skipped.push(t.dataset.t);
  else return;
  e.preventDefault();render();
});
document.addEventListener("input",e=>{const el=e.target;if(/^(d_|pg_)/.test(el.id))daily[el.id]=el.value;if(el.dataset.k&&el.dataset.i!==undefined&&state.consults[+el.dataset.i])state.consults[+el.dataset.i][el.dataset.k]=el.value;});
document.addEventListener("change",e=>{if(e.target.dataset.k==="due"&&state.tab==="write")render();});
initBar();render();
</script>
